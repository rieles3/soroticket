name: Testnet acceptance
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: soroticket-testnet-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: npm run bootstrap
      - run: npm --prefix sdk/ts run build
      - name: SDK Go live testnet
        working-directory: tests/e2e/go
        run: go run .
      - name: SDK TypeScript live testnet
        working-directory: tests/e2e/ts
        run: node e2e.mjs
      - name: Start testnet Cloud
        run: |
          cd cloud/api
          go build -o /tmp/soroticket-cloud .
          SOROTICKET_DATA=/tmp/soroticket-t1 /tmp/soroticket-cloud > /tmp/cloud.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/readyz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Confirmed footprint conflict recovery
        run: node tests/e2e/ts/concurrency.mjs
      - name: Burn, Tally, privacy and independent verification
        run: npm run e2e:cloud
      - name: Executable API collection
        run: npm run e2e:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-evidence
          path: artifacts/t1/*
